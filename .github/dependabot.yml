# Dependency hygiene (OSS_SPEC §14): one entry per ecosystem the repo
# actually uses. npm covers the root workspace and the pwa workspace (npm
# workspaces resolve through the root lockfile); github-actions covers every
# `uses:` in .github/workflows/.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
