name: setup
description: >
  Node from .nvmrc plus an installed dependency tree. Every ci.yml job that
  runs repo tooling opens with this; it exists because the fan-out repeats the
  same two steps across five jobs, and a Node change would otherwise have five
  places to land. Checkout stays in the caller — the changeset job needs full
  history and the rest do not.

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        cache: npm
    - run: npm ci
      shell: bash
