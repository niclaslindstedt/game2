name: version-bump

# THE ONE WAY A RELEASE STARTS: a maintainer dispatches this, and nothing
# else in the repository cuts a version.
#
# It is small and read-only on purpose. The checks below — main, a clean
# tree, the version the fragments add up to, a tag that does not exist yet —
# run and print before anything is written, and only then does it hand off
# to release.yml by `workflow_call`. So the whole release is ONE dispatched
# run: the commit, the tag, the GitHub Release, the desktop downloads and the
# Pages deploy, all under the default GITHUB_TOKEN. No token is stored, no tag
# is force-pushed, and a hand-pushed `v*` tag starts nothing.
#
# `bump` defaults to `auto` — derived from the .changes/unreleased/ fragments
# by the framework's ogf-compute-bump. Pick patch/minor/major to override.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type (auto | patch | minor | major). 'auto' reads the changeset fragments."
        required: false
        default: auto
        type: choice
        options:
          - auto
          - patch
          - minor
          - major

permissions: {}

jobs:
  # The read-only preflight: the branch, the tree, the fragments, and the
  # version the release will produce — printed, so a maintainer sees what a
  # dispatch is about to do before release.yml writes anything.
  preflight:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      bump: ${{ steps.plan.outputs.bump }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      - name: Verify main, clean
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::releases are cut from main only (got $GITHUB_REF)"
            exit 1
          fi
          if ! git diff --quiet || ! git diff --quiet --cached; then
            echo "::error::working tree is not clean — refusing to release"
            git status
            exit 1
          fi

      - name: Plan the version
        id: plan
        env:
          REQUESTED: ${{ inputs.bump }}
        run: |
          if [ "$REQUESTED" = "auto" ] || [ -z "$REQUESTED" ]; then
            BUMP=$(npx ogf-compute-bump)
          else
            BUMP="$REQUESTED"
          fi
          LATEST_TAG=$(git tag --list 'v*' --sort=-v:refname | head -n1)
          CURRENT="${LATEST_TAG#v}"
          CURRENT="${CURRENT:-0.0.0}"
          IFS=. read -r MAJOR MINOR PATCH <<<"$CURRENT"
          case "$BUMP" in
            major) MAJOR=$((MAJOR+1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR+1)); PATCH=0 ;;
            patch) PATCH=$((PATCH+1)) ;;
            *) echo "::error::unknown bump '$BUMP'"; exit 1 ;;
          esac
          NEXT="v${MAJOR}.${MINOR}.${PATCH}"
          if git rev-parse -q --verify "refs/tags/$NEXT" >/dev/null; then
            echo "::error::$NEXT already exists"
            exit 1
          fi
          echo "bump=$BUMP" >> "$GITHUB_OUTPUT"
          echo "Will release $NEXT (bump: $BUMP, from ${LATEST_TAG:-nothing})"

  release:
    needs: preflight
    uses: ./.github/workflows/release.yml
    with:
      bump: ${{ needs.preflight.outputs.bump }}
    permissions:
      contents: write
      pages: write
      id-token: write
    secrets: inherit
