name: release

# Manual-only. The maintainer dispatches this and the workflow derives
# the semver bump from the changeset fragments in .changes/unreleased/
# (their front-matter carries the Added/Changed/Fixed/... type and an
# optional `breaking: true` — see scripts/release/compute-bump.mjs),
# then consumes those fragments into a new CHANGELOG section, updates
# every shipped version string via scripts/update-versions.sh, tags
# vX.Y.Z, pushes, creates a GitHub Release, then chains into pages.yml
# so the new tag is served at `/` (and the same code at `/preview/`
# because main now matches the tag) without waiting for the next push.
#
# `bump` defaults to `auto` — the fragment-derived bump above. Set it to
# an explicit patch/minor/major only to override that derivation.
#
# Because the release commit, tag, GitHub Release, and Pages deploy all
# happen inside this one dispatched run (the deploy is a workflow_call
# chain, not a cross-workflow trigger), the default GITHUB_TOKEN is
# sufficient — no RELEASE_TOKEN PAT is needed.
#
# The desktop downloads (tauri/, docs/platforms.md) are packaged by the
# `desktop` matrix between `release` and the `publish` flag-flip: the
# release is created as a DRAFT, every platform attaches its download,
# and only then is it made public — so no player ever finds a release
# page whose download for their machine is missing.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Semver bump. 'auto' derives it from the .changes/unreleased/ fragments (breaking → major, Added/Changed/Removed/Deprecated → minor, Fixed/Security → patch). Pick patch/minor/major to override."
        required: true
        type: choice
        default: auto
        options:
          - auto
          - patch
          - minor
          - major

# Default to no permissions; every job declares its own least-privilege
# `permissions:` block.
permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    # contents: write — this job pushes the release commit and the tag.
    permissions:
      contents: write
      # npm ci resolves @niclaslindstedt/oss-framework from GitHub Packages.
      packages: read
    outputs:
      version: ${{ steps.bump.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: "https://npm.pkg.github.com"
          scope: "@niclaslindstedt"
      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify clean working tree
        run: |
          if ! git diff --quiet || ! git diff --quiet --cached; then
            echo "::error::working tree is not clean — refusing to release"
            git status
            exit 1
          fi

      # Resolve the effective bump. `auto` (the default) derives it from
      # the changeset fragments' front-matter so the release needs no
      # human judgement; an explicit patch/minor/major from the dispatch
      # form overrides that derivation.
      - name: Resolve bump
        id: resolve
        run: |
          if [ "${{ inputs.bump }}" = "auto" ] || [ -z "${{ inputs.bump }}" ]; then
            BUMP=$(node scripts/release/compute-bump.mjs)
            echo "Auto-derived bump from fragments: $BUMP"
          else
            BUMP="${{ inputs.bump }}"
            echo "Using requested bump override: $BUMP"
          fi
          echo "bump=$BUMP" >> "$GITHUB_OUTPUT"

      # Compute the next version from the highest released tag (not from
      # package.json, which could lag), then rewrite every shipped
      # version string — root + workspace package.json, the lockfile,
      # and engine/version.ts — via the script that owns them.
      - name: Bump version
        id: bump
        run: |
          LATEST_TAG=$(git tag --list 'v*' --sort=-v:refname | head -n1)
          CURRENT="${LATEST_TAG#v}"
          CURRENT="${CURRENT:-0.0.0}"
          IFS=. read -r MAJOR MINOR PATCH <<<"$CURRENT"
          case "${{ steps.resolve.outputs.bump }}" in
            major) MAJOR=$((MAJOR+1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR+1)); PATCH=0 ;;
            patch) PATCH=$((PATCH+1)) ;;
            *) echo "::error::unknown bump '${{ steps.resolve.outputs.bump }}'"; exit 1 ;;
          esac
          VERSION="${MAJOR}.${MINOR}.${PATCH}"
          ./scripts/update-versions.sh "v${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Bumped from ${LATEST_TAG:-nothing} to v${VERSION}"

      - name: Collate changelog
        run: node scripts/release/collate-changelog.mjs "${{ steps.bump.outputs.version }}"

      - name: Extract release-notes body
        run: |
          node scripts/release/extract-section.mjs "${{ steps.bump.outputs.version }}" > .release-notes.md
          cat >> .release-notes.md <<'NOTES'

          ---

          Play this release at https://game2.niclaslindstedt.se/ — it is an
          installable PWA (add it to your home screen) and works offline
          once loaded.

          ### Desktop downloads

          The same game as a desktop app, below: an installer for Windows,
          a `.dmg` for macOS (`aarch64` for Apple Silicon, `x64` for an
          Intel Mac), and a `.deb` or `.AppImage` for Linux.

          **macOS:** the app is signed but not notarized, so the first
          launch is refused. Open **System Settings → Privacy & Security**,
          scroll to the message about Scandinavian Flick and choose
          **Open Anyway**. macOS remembers after that.
          NOTES

      - name: make build
        run: make build
      - name: make test
        run: make test

      - name: Commit + tag
        env:
          TAG: ${{ steps.bump.outputs.tag }}
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json pwa/package.json engine/version.ts CHANGELOG.md .changes/unreleased
          git commit -m "chore(release): v${VERSION}"
          git tag -a "$TAG" -m "Release ${TAG}"
          git push origin HEAD:main
          git push origin "$TAG"

      # A DRAFT, and the `publish` job at the bottom is what makes it
      # public — once every platform's download is attached to it.
      #
      # Published here instead, the release would be visible the moment the
      # tag exists, minutes before the desktop downloads finish uploading
      # and regardless of whether they succeed at all: a Windows packaging
      # failure (`fail-fast: false`, so the other two carry on) would leave
      # a public release whose Windows download simply is not there, and
      # the people who find it are the ones who came to download the game.
      #
      # Idempotent on purpose: the tag is already pushed by the step above,
      # so a bare `gh release create` that fails (or a re-run after one did)
      # would leave a tagged version with no release at all. The edit
      # deliberately does NOT pass `--draft`, so re-running against a
      # release that is already public refreshes its notes instead of
      # retracting it.
      - name: Create GitHub Release (draft)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.bump.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — updating its notes."
            gh release edit "$TAG" --title "$TAG" --notes-file .release-notes.md
          else
            gh release create "$TAG" --draft --title "$TAG" --notes-file .release-notes.md
          fi

  # The desktop downloads, attached to the draft the job above created. One
  # runner per platform, because each one packages the shell for its own OS
  # in the platform's own webview, and the bundle has to be built where the
  # app will run. `tauri/scripts/package.mjs` names every download
  # `scanflick-<version>-<os>-<arch>.<ext>`.
  desktop:
    needs: release
    name: desktop (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows
          - os: macos-latest
            target: macos
          - os: ubuntu-latest
            target: linux
    runs-on: ${{ matrix.os }}
    # contents: write — the downloads are uploaded onto the GitHub Release.
    permissions:
      contents: write
      packages: read
    env:
      # The release commit is on the tag, so the build is made from exactly
      # what was tagged rather than from whatever main looks like by now.
      TAG: ${{ needs.release.outputs.tag }}
      # NEVER UNSIGNED on macOS: Apple Silicon refuses to execute unsigned
      # arm64 code and reports it to the player as "the app is damaged". An
      # absent secret means the ad-hoc signature `package.mjs` falls back to
      # — the app runs, and the player answers one Gatekeeper prompt (the
      # release notes say how). A Developer ID identity here signs for real.
      APPLE_SIGNING_IDENTITY: ${{ secrets.MAC_SIGN_IDENTITY }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.tag }}
      # The website build lives in the root workspace; the shell copies its
      # output and packages around it.
      - uses: ./.github/actions/setup
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri

      - name: Linux packaging libraries
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Package
        shell: bash
        run: npm run tauri:package

      # Whatever this platform's packager produced — a job that listed
      # filenames would silently upload nothing the day a target changed
      # its suffix.
      - name: Attach to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          assets=(tauri/release/*)
          if [ ${#assets[@]} -eq 0 ]; then
            echo "::error::${{ matrix.target }} produced no downloads"
            ls -R tauri/release || true
            exit 1
          fi
          printf 'uploading %s\n' "${assets[@]}"
          gh release upload "$TAG" "${assets[@]}" --clobber

  # THE RELEASE BECOMES VISIBLE HERE, and nowhere else: `needs: desktop`
  # means every platform in the matrix has packaged AND uploaded before
  # anybody can see the release page. If one target fails, the draft stays
  # a draft — a release that is missing a download is a bug report from
  # every player on that platform, and the fix (re-dispatch, or upload the
  # file by hand and flip the draft off) is much cheaper while nobody has
  # seen it yet.
  publish:
    needs: [release, desktop]
    runs-on: ubuntu-latest
    # contents: write — this is the flag flip on the release itself.
    permissions:
      contents: write
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          gh release edit "$TAG" --draft=false --latest
          gh release view "$TAG" --json assets \
            --jq '.assets[] | "published asset: \(.name)"'

  # Chain straight into pages.yml so the new tag is served at `/`
  # immediately — without this, deployment would wait for the next
  # push to main.
  #
  # Deliberately `needs: release` and not `needs: publish`: the website IS
  # the game, it is built from the tag that already exists, and holding the
  # web deploy hostage to a desktop packaging failure would take the
  # free-to-play version down over a download nobody has yet.
  pages:
    needs: release
    uses: ./.github/workflows/pages.yml
    with:
      release_ref: ${{ needs.release.outputs.tag }}
    permissions:
      # pages.yml declares `contents: write` at the top level because its
      # assemble job force-pushes the /branch/ slot to the `branch-deploy`
      # orphan branch, and `packages: read` because its npm ci resolves the
      # framework from GitHub Packages. A reusable workflow can't be granted
      # fewer permissions than it requests, so these must match or the whole
      # release run fails at startup before any job runs.
      contents: write
      pages: write
      id-token: write
      packages: read
    secrets: inherit
