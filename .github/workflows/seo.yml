name: seo

# Structural SEO assertions (OSS_SPEC §11.3). Runs `check-seo.mjs` against
# the built app so the discoverability failure modes the spec calls out
# (empty SPA shell, missing canonical, JSON-LD drift from og:image, sitemap
# gaps, llms.txt missing, critical-path JS budget breach) cannot ship
# silently.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  # npm ci resolves @niclaslindstedt/oss-framework from GitHub Packages.
  packages: read

jobs:
  check-seo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: "https://npm.pkg.github.com"
          scope: "@niclaslindstedt"
      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run build --workspace pwa
      - run: npm run check:seo
