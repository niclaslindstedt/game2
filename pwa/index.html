<!doctype html>
<!-- `data-theme` seeds the framework token preset the shell chrome (update
     toast) reads; the game itself paints its own canvas. -->
<html lang="en" data-theme="githubDark">
  <head>
    <meta charset="UTF-8" />
    <!-- Lock the viewport scale: an installed PWA is a game, not a document.
         `maximum-scale=1, user-scalable=no` disables pinch-zoom and iOS's
         focus auto-zoom; `viewport-fit=cover` lets the game paint under the
         notch / home indicator (the HUD pads with `env(safe-area-inset-*)`). -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Scandinavian Flick — arcade rally drifting in your browser</title>
    <meta
      name="description"
      content="A drift-first arcade rally game in your browser: low-poly 3D stages generated fresh every day — hairpins, jumps, fords. Playable on phone and desktop, offline once loaded. No account, no download."
    />
    <link rel="canonical" href="https://game2.niclaslindstedt.se/" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="Scandinavian Flick — arcade rally drifting in your browser"
    />
    <meta
      property="og:description"
      content="Drift-first arcade rally in the browser. 3D stages generated fresh every day — hairpins, jumps, fords. Phone and desktop, offline once loaded."
    />
    <meta property="og:url" content="https://game2.niclaslindstedt.se/" />
    <meta property="og:image" content="https://game2.niclaslindstedt.se/og.png" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Scandinavian Flick — arcade rally drifting in your browser"
    />
    <meta
      name="twitter:description"
      content="Drift-first arcade rally in the browser. 3D stages generated fresh every day — hairpins, jumps, fords."
    />
    <meta name="twitter:image" content="https://game2.niclaslindstedt.se/og.png" />

    <!-- JSON-LD -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "VideoGame",
        "name": "Scandinavian Flick",
        "applicationCategory": "GameApplication",
        "genre": ["Racing", "Arcade"],
        "operatingSystem": "Any",
        "playMode": "SinglePlayer",
        "description": "A drift-first arcade rally game in the browser: low-poly 3D stages generated fresh every day — hairpins, jumps, fords. Playable on phone and desktop, offline once loaded.",
        "url": "https://game2.niclaslindstedt.se/",
        "image": "https://game2.niclaslindstedt.se/og.png",
        "author": {
          "@type": "Person",
          "name": "Niclas Lindstedt",
          "url": "https://github.com/niclaslindstedt"
        },
        "offers": { "@type": "Offer", "price": "0" }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
