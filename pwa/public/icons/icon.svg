<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- The app mark: the flick itself. Two tyre tracks swing the car away from
       the corner and whip it back — one S of two tangent arcs — with a white
       rally car held sideways at the head of them, on Swedish blue and yellow.
       The raster icons (pwa-*.png, apple-touch, favicon, og.png) are generated
       from this same geometry by scripts/generate-icons.mjs — keep the two in
       lockstep. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#123069"/>
      <stop offset="1" stop-color="#1f7fe0"/>
    </linearGradient>
    <!-- The tail dissolves into the sky rather than stopping. -->
    <linearGradient id="tail" gradientUnits="userSpaceOnUse"
      x1="78" y1="462" x2="168" y2="408">
      <stop offset="0" stop-color="#ffd23e" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffd23e" stop-opacity="1"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#sky)"/>
  <g fill="none" stroke="url(#tail)" stroke-width="26">
    <path d="M 26.78 444.17 A 230 230 0 0 1 213.45 315.88 A 135 135 0 0 0 336.17 193.16"/>
    <path d="M 98.68 479.24 A 150 150 0 0 1 220.43 395.57 A 215 215 0 0 0 415.87 200.13"/>
  </g>
  <g transform="translate(356,222) rotate(-35)">
    <rect x="-22" y="-10" width="44" height="20" rx="5" fill="#123069" transform="translate(56,-50) rotate(-22)"/>
    <rect x="-22" y="-10" width="44" height="20" rx="5" fill="#123069" transform="translate(56,50) rotate(-22)"/>
    <rect x="-22" y="-10" width="44" height="20" rx="5" fill="#123069" transform="translate(-58,-50)"/>
    <rect x="-22" y="-10" width="44" height="20" rx="5" fill="#123069" transform="translate(-58,50)"/>
    <rect x="-96" y="-46" width="192" height="92" rx="18" fill="#123069"/>
    <rect x="-87" y="-37" width="174" height="74" rx="9" fill="#f6f3ea"/>
    <rect x="-32" y="-29" width="64" height="58" rx="11" fill="#123069" transform="translate(-8,0)"/>
  </g>
</svg>
